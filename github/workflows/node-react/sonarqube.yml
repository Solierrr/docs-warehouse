name: SonarQube

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  sonarqube:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # github-token and run-id are required: workflow_run jobs default to
      # looking for artifacts in their OWN run, which never has any. Without
      # these two lines this step always fails with
      # "Artifact not found for name: coverage".
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
