name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate the manifests
        run: |
          docker run --rm -v "$PWD":/work ghcr.io/yannh/kubeconform:v0.7.0       -ignore-missing-schemas -summary /work/apps /work/bootstrap /work/services
