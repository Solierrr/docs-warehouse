name: Storybook

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storybook:
    uses: Solierrr/docs-warehouse/.github/workflows/storybook.yml@main
    with:
      publish: ${{ github.event_name != 'pull_request' }}
